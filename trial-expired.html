<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Expired - WhatsApp CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e, #1a1a2e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .expired-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        .expired-icon {
            font-size: 60px;
            color: #e74c3c;
            margin-bottom: 20px;
        }
        
        .expired-card h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }
        
        .expired-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .btn-upgrade {
            background: #25D366;
            color: white;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .btn-upgrade:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }
        
        .btn-logout {
            background: transparent;
            color: #666;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="expired-card">
    <div class="expired-icon">
        <i class="fas fa-lock"></i>
    </div>
    <h2>Trial Expired</h2>
    <p>Your 5-day free trial has ended.</p>
    <p>Upgrade now to continue using WhatsApp CRM with all features.</p>
    
    <div style="background: #f0fff4; border-radius: 10px; padding: 15px; margin: 20px 0;">
        <strong style="color: #128C7E;">Plans start at just ₹200/month</strong>
        <br>
        <small>Less than a cup of chai per day!</small>
    </div>
    
    <a href="payment-gateway.html" class="btn btn-upgrade">
        <i class="fas fa-credit-card"></i> Upgrade Now
    </a>
    
    <button class="btn-logout" onclick="window.location.href='index.html'">
        Back to Home
    </button>
</div>

</body>
</html>
